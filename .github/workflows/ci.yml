name: CI Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Fail-Closed Repository Identity Assertion
        run: |
          echo "Verifying workflow execution repository identity..."
          if [ "$GITHUB_REPOSITORY" != "legit2code/hitdna" ]; then
            echo "::error::REPOSITORY_IDENTITY_MISMATCH: Workflow intended exclusively for legit2code/hitdna cannot run on $GITHUB_REPOSITORY. Halting cross-project workflow execution."
            exit 1
          fi
          echo "Repository identity confirmed: $GITHUB_REPOSITORY (HitDNA)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci || npm install

      - name: 2. Preflight Cross-Repository Push & Contamination Check
        run: npx tsx scripts/verify-hitdna-identity.ts

      - name: Run Integrity Bootstrap Check
        run: npx tsx scripts/check-integrity.ts

      - name: Strict Typecheck
        run: npm run lint

      - name: Unit & Integration Tests
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Phase Verification (P01)
        run: npm run phase:verify P01
