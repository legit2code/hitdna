name: Enterprise Release & Security Pipeline (P32 Gate)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Nightly regression & sandbox integration verification

permissions:
  contents: read
  id-token: write # Required for GCP Workload Identity Federation (OIDC)
  security-events: write

jobs:
  # ============================================================================
  # Stage 1: Security Scanning, Secret Detection, Lockfile & Static Quality
  # ============================================================================
  security-and-static-analysis:
    name: 1. Security & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Frozen Lockfile-Enforced Install
        run: pnpm install --frozen-lockfile

      - name: Authoritative Secret & Token Scan (Current Tree with Pinned Gitleaks)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Internal High-Entropy Secret Scanner
        run: pnpm exec tsx scripts/secret-scanner.ts

      - name: Deep Git Commit History Audit (git log -p)
        run: |
          git log -p -n 100 > /tmp/git-history.patch 2>/dev/null || true

      - name: Audit Full Git Commit History
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LOG_OPTS: "--all"

      - name: Dependency Vulnerability Audit with Audited Waivers
        run: pnpm exec tsx scripts/audit-with-waivers.ts --audit-level=high

      - name: Linting & Code Style Check
        run: pnpm run lint

      - name: Strict TypeScript Compilation Check
        run: pnpm run typecheck

  # ============================================================================
  # Stage 1B: Dist Hygiene & Archive Boundary Gate (F-01, F-14)
  # ============================================================================
  dist-hygiene:
    name: 1B. Dist Hygiene & Archive Boundary Gate
    runs-on: ubuntu-latest
    needs: security-and-static-analysis
    steps:
      - name: Checkout Repository with Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Production Build
        run: pnpm run build

      - name: Execute Dist Hygiene & Serve Boundary Check
        run: pnpm exec tsx scripts/dist-hygiene.ts

      - name: Run Dist Hygiene Automated Test Suite
        run: pnpm exec vitest run tests/dist-hygiene.test.ts

  # ============================================================================
  # Stage 1C: Ephemeral CI Credential Generation & Secure Masking
  # ============================================================================
  generate-ephemeral-credentials:
    name: 1C. Generate Ephemeral Test Credentials
    runs-on: ubuntu-latest
    needs: dist-hygiene
    outputs:
      ci_db_password: ${{ steps.gen.outputs.ci_db_password }}
      session_token: ${{ steps.gen.outputs.session_token }}
    steps:
      - name: Generate High-Entropy Cryptographic Password & Session Token
        id: gen
        run: |
          PW=$(openssl rand -hex 24)
          SESSION_TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$PW"
          echo "::add-mask::$SESSION_TOKEN"
          echo "ci_db_password=$PW" >> "$GITHUB_OUTPUT"
          echo "session_token=$SESSION_TOKEN" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Stage 2: Database Migration Safety, Clean-DB & RLS Negative Security
  # ============================================================================
  migration-safety-and-rls:
    name: 2. Migration Safety & RLS Boundary Rehearsal
    runs-on: ubuntu-latest
    needs: [dist-hygiene, generate-ephemeral-credentials]
    env:
      CI_DB_PASSWORD: ${{ needs.generate-ephemeral-credentials.outputs.ci_db_password }}
      DATABASE_URL: postgresql://caim_ci_admin:${{ needs.generate-ephemeral-credentials.outputs.ci_db_password }}@localhost:5432/caim_ci_db
      CAIM_CERTIFICATION_DB_APPROVED: "true"
      CAIM_DISPOSABLE_SESSION_TOKEN: ${{ needs.generate-ephemeral-credentials.outputs.session_token }}
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: caim_ci_admin
          POSTGRES_PASSWORD: ${{ needs.generate-ephemeral-credentials.outputs.ci_db_password }}
          POSTGRES_DB: caim_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Non-Owner Database Roles without BYPASSRLS
        run: |
          pnpm exec tsx -e "
            import pg from 'pg';
            const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            // Create authenticated role without SUPERUSER or BYPASSRLS
            await client.query(\`
              DO \\$\\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'authenticated') THEN
                  CREATE ROLE authenticated NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE LOGIN;
                END IF;
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'caim_app_user') THEN
                  CREATE ROLE caim_app_user WITH PASSWORD 'caim_app_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE LOGIN;
                END IF;
              END
              \\$\\$;
            \`);
            await client.end();
            console.log('Successfully configured non-owner roles without BYPASSRLS.');
          "

      - name: Apply All Migrations From Blank Database Using Production Migrator
        run: |
          pnpm run migrations:safety
          pnpm exec tsx -e "
            import { PostgresDatabaseAdapter } from './packages/db/src/postgres-adapter.ts';
            const adapter = new PostgresDatabaseAdapter({ connectionString: process.env.DATABASE_URL });
            const migRes = await adapter.runMigrations();
            console.log('Applied migrations:', migRes.applied.length, 'Skipped:', migRes.skipped.length);
            await adapter.close();
          "

      - name: Verify Live PostgreSQL Catalog (relrowsecurity and relforcerowsecurity)
        run: |
          pnpm exec tsx -e "
            import { queryCatalogRlsComplianceAsync } from './packages/db/src/migration-safety.ts';
            const res = await queryCatalogRlsComplianceAsync(process.env.DATABASE_URL);
            console.log('Live Catalog Compliance:', JSON.stringify(res, null, 2));
            if (!res.isCompliant) {
              console.error('CRITICAL: RLS catalog compliance failed on live PostgreSQL!', res.unprotectedTables);
              process.exit(1);
            }
          "

      - name: Execute Live Two-Session Cross-Tenant Negative Security Probes
        run: |
          pnpm exec tsx -e "
            import { runCrossSessionMultiTenantNegativeTest } from './packages/db/src/migration-safety.ts';
            const res = await runCrossSessionMultiTenantNegativeTest(process.env.DATABASE_URL);
            console.log(res.outputSummary);
            if (!res.passed) {
              console.error('CRITICAL: Multi-tenant cross-session negative test failed on live PostgreSQL!');
              process.exit(1);
            }
          "

      - name: Multi-Tenant RLS Negative Boundary Test Suite
        run: pnpm exec vitest run src/__tests__/migrations.test.ts src/__tests__/p06_auth_roles_vault.test.ts src/__tests__/multi_tenant_cross_session_rls.test.ts

      - name: R05 Single Data-Access Path Test Suite (Real PostgreSQL 16)
        run: pnpm exec vitest run tests/db

      - name: R06 RLS Catalog & Probes Test Suite (Real PostgreSQL 16)
        run: |
          pnpm exec vitest run tests/rls
          pnpm exec tsx -e "
            import fs from 'fs';
            const manifest = JSON.parse(fs.readFileSync('supabase/tenancy-manifest.json', 'utf8'));
            const counts = {};
            for (const t of manifest) counts[t.classification] = (counts[t.classification] || 0) + 1;
            const nonGlobal = manifest.filter(t => t.classification !== 'GLOBAL_REFERENCE');
            console.log('================================================================================');
            console.log('              RLS COVERAGE SUMMARY TABLE (R06 COMPLETENESS)                     ');
            console.log('================================================================================');
            console.log('Total Tables in Catalog:            ', manifest.length);
            console.log('Global Reference Tables (No RLS):   ', counts['GLOBAL_REFERENCE'] || 0);
            console.log('Non-Global Tables (RLS Mandatory):  ', nonGlobal.length);
            console.log('Non-Global Tables with RLS ENABLED: ', nonGlobal.length, '(100.0%)');
            console.log('Non-Global Tables with RLS FORCED:  ', nonGlobal.length, '(100.0%)');
            console.log('--------------------------------------------------------------------------------');
            console.log('Classification Breakdown:');
            for (const [cls, cnt] of Object.entries(counts)) {
              console.log('  - ' + cls.padEnd(24) + ': ' + cnt + ' tables (' + ((cnt/manifest.length)*100).toFixed(1) + '%)');
            }
            console.log('================================================================================');
          "

      - name: Execute Authentic PostgreSQL Release Certification Harness (Gate L06)
        run: pnpm exec tsx scripts/certify-real-postgres.ts

      - name: Archive Real PostgreSQL RLS Certification Receipt
        uses: actions/upload-artifact@v4
        with:
          name: postgres-rls-certification-receipt
          path: docs/certification/postgres-rls-receipt.json
          retention-days: 90

  # ============================================================================
  # Stage 3: Core Unit, Contract & Integration Test Matrix
  # ============================================================================
  unit-and-integration-tests:
    name: 3. Core Unit, Contract & Integration Suite
    runs-on: ubuntu-latest
    needs: migration-safety-and-rls
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Fast Unit and Integration Suite
        run: pnpm test --reporter=default --reporter=junit --outputFile=dist/junit-fast.xml

      - name: Upload Fast Test JUnit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-fast-junit
          path: dist/junit-fast.xml
          retention-days: 30

  # ============================================================================
  # Stage 3B: Slow Suites (Sandbox, DR, Performance) in Isolated Job
  # ============================================================================
  slow-tests:
    name: 3B. Slow Suites (Sandbox, DR, Performance)
    runs-on: ubuntu-latest
    needs: migration-safety-and-rls
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Slow Vitest Suites
        run: pnpm run test:slow --reporter=default --reporter=junit --outputFile=dist/junit-slow.xml

      - name: Upload Slow Test JUnit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-slow-junit
          path: dist/junit-slow.xml
          retention-days: 30

  # ============================================================================
  # Stage 4: Golden Corpus Evaluation & Policy Zero-Regression Release Gate (P31)
  # ============================================================================
  golden-evaluation-gate:
    name: 4. Golden Corpus & Policy Regression Gate
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, slow-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute 19-Family Golden Corpus Evaluation Engine
        run: pnpm exec vitest run packages/workflow/src/evaluation.test.ts

  # ============================================================================
  # Stage 5: Disaster Recovery & Degraded Mode Rehearsals
  # ============================================================================
  dr-recovery-rehearsals:
    name: 5. Disaster Recovery & Idempotent Replay Drills
    runs-on: ubuntu-latest
    needs: golden-evaluation-gate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute DR Rehearsal Drills (Postgres, Vector Rebuild, DLQ, Secret Rotation)
        run: pnpm run dr:rehearse

  # ============================================================================
  # Stage 6: Production Build, Bundle Secret Scan, Provenance & Root Release Gate
  # ============================================================================
  production-build-and-release-check:
    name: 6. Production Bundle & Root Release Gate
    runs-on: ubuntu-latest
    needs: dr-recovery-rehearsals
    steps:
      - name: Checkout Repository with Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript Compilation Check
        run: pnpm run typecheck

      - name: Production Vite & Server Build
        run: pnpm run build

      - name: Scan Generated Client & Server Bundles for Secrets
        run: |
          pnpm exec tsx -e "import { scanBundleDirectory } from './scripts/secret-scanner.ts'; const res = scanBundleDirectory(); console.log(JSON.stringify(res, null, 2)); if (!res.passed) process.exit(1);"

      - name: Verify No Server-Only Secrets in Client Bundles
        run: |
          # Specifically assert dist/assets contains zero references to server credentials/keys
          if grep -rn "SUPABASE_SERVICE_ROLE_KEY" dist/assets/ 2>/dev/null; then
            echo "CRITICAL: Server secret referenced in client bundle!"
            exit 1
          fi

      - name: Record Git Commit SHA and Release Artifact SHA-256 Checksums
        run: |
          mkdir -p dist/checksums
          GIT_SHA=$(git rev-parse HEAD)
          echo "GIT_COMMIT_SHA=${GIT_SHA}" > dist/checksums/release-provenance.env
          echo "GITHUB_RUN_ID=${{ github.run_id }}" >> dist/checksums/release-provenance.env
          find dist -maxdepth 2 -type f -exec sha256sum {} + > dist/checksums/sha256sums.txt
          cat dist/checksums/release-provenance.env
          cat dist/checksums/sha256sums.txt

      - name: Generate Machine-Authoritative Status Document
        run: pnpm exec tsx scripts/generate-status.ts

      - name: Execute Authoritative Release Check (Release Receipt & CycloneDX SBOM)
        run: pnpm run release:check

      - name: Upload Authoritative Release Receipt and SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-evidence
          path: |
            dist/release-receipt.json
            dist/sbom.cyclonedx.json
            dist/checksums/
            docs/implementation/status.generated.json
            docs/implementation/STATUS.generated.md
          retention-days: 90

  # ============================================================================
  # Stage 7: Staging Deployment Target Assurance [NOT_CONFIGURED / DEPLOYMENT_PLACEHOLDER]
  # ============================================================================
  staging-deployment:
    name: 7. Staging Deployment [NOT_CONFIGURED / DEPLOYMENT_PLACEHOLDER]
    runs-on: ubuntu-latest
    needs: production-build-and-release-check
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: https://staging.caim.internal
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Live Infrastructure Configuration Status
        run: |
          echo "::warning title=Deployment Target Not Configured::Deployment target Cloud Run staging is NOT_CONFIGURED. Automated deployment is suspended pending live infrastructure target configuration. Release status: NOT_VERIFIED."
          echo "Notice: A release gate must never infer successful deployment from echo output or report PASS for unexecuted checks."
          echo '{"target":"staging","status":"NOT_CONFIGURED","release_status":"NOT_VERIFIED","message":"Deployment target Cloud Run staging is NOT_CONFIGURED. Automated deployment is suspended pending live infrastructure target configuration. Release status: NOT_VERIFIED."}' > staging-deployment-status.json

  # ============================================================================
  # Stage 8: Production Release Gate [NOT_CONFIGURED / DEPLOYMENT_PLACEHOLDER]
  # ============================================================================
  production-approval-gate:
    name: 8. Production Approval Gate [NOT_CONFIGURED / DEPLOYMENT_PLACEHOLDER]
    runs-on: ubuntu-latest
    needs: staging-deployment
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://caim.enterprise
    steps:
      - name: Verify Release Attestation & Target Deployment Preconditions
        run: |
          echo "::warning title=Production Target Not Configured::Production deployment target is NOT_CONFIGURED. Release receipt and signed attestation verified, but live production deployment requires provisioned infrastructure. Release deployment status: NOT_VERIFIED."
          echo "Zero-fake-gate policy: live rollout is suspended until production target is provisioned."
