name: CI Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci || npm install

      - name: Run Integrity Bootstrap Check
        run: npx tsx scripts/check-integrity.ts

      - name: Strict Typecheck
        run: npm run lint

      - name: Unit & Integration Tests
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Phase Verification (P01)
        run: npm run phase:verify P01
