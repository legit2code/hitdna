name: Scheduled Autonomous Discovery Cycle

on:
  schedule:
    # Fallback trigger: executes every 10 minutes matching standard discovery cadence
    # Note: GitHub Actions scheduler may experience delays under high platform load;
    # primary reliable triggering is invoked via Cloudflare Worker Cron Trigger.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Trigger invocation reason'
        required: false
        default: 'External Cloudflare Cron or Manual Dispatch'

permissions:
  contents: read

jobs:
  run-discovery:
    name: Execute Autonomous Discovery Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Discovery Cycle & Report Results
        # Strictly uses scoped service tokens for reporting back to the API.
        # NEVER passes or requires raw production database connection strings.
        env:
          CAIM_API_URL: ${{ secrets.CAIM_API_URL }}
          CAIM_DISCOVERY_SERVICE_TOKEN: ${{ secrets.CAIM_DISCOVERY_SERVICE_TOKEN }}
        run: pnpm exec tsx scripts/run-discovery-cycle.ts
