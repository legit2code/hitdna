name = "caim-discovery-cron-scheduler"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Cron Trigger: fires every 10 minutes to reliably trigger GitHub Actions discovery cycle
[triggers]
crons = ["*/10 * * * *"]

# Non-sensitive configuration variables
[vars]
GITHUB_OWNER = "caim-project"
GITHUB_REPO = "caim"
GITHUB_WORKFLOW_FILE = "discovery-cycle.yml"
GITHUB_REF = "main"

# Secrets (Provision via `wrangler secret put <NAME>`):
# - GITHUB_DISPATCH_TOKEN: Scoped GitHub Personal Access Token or Fine-Grained Token with 'actions:write' permission
# NO database credentials, connection strings, or internal master keys are stored or exposed here.
